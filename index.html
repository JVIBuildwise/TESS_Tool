<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISO 52120 / SRI</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <button id="home-btn" class="brand-btn">
        <span class="brand-icon">🏠</span>
        <span class="brand-text" id="brand-text">ISO 52120 / SRI</span>
      </button>
    </div>

    <div class="toolbar">
      <span id="objective-chip" class="objective-chip" hidden></span>
      <select id="lang-select">
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
      <button id="export-btn"></button>
      <label class="file-btn" id="import-btn">
        <span id="import-label-text"></span>
        <input type="file" id="import-input" accept="application/json" />
      </label>
      <button id="reset-btn"></button>
    </div>
  </header>

  <main id="app-root">
    <!-- Le contenu (accueil ou espace de travail) est généré dynamiquement par js/app.js -->
  </main>

  <footer class="app-footer">
    <span id="app-footer-text"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
